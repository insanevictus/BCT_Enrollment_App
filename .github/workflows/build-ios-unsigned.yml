name: Build BCT Enrollment System - Unsigned iOS Archive

on:
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      # Run the same Flet CLI diagnostics that preceded the successful
      # simulator build. This also prepares the project environment.
      - name: Diagnose and prepare Flet CLI
        run: |
          echo "===== Python version ====="
          uv run python --version

          echo "===== Installed Flet packages ====="
          uv pip show flet
          uv pip show flet-cli || true

          echo "===== Flet Python package version ====="
          uv run python -c "import flet; print('Flet:', flet.__version__); print('Location:', flet.__file__)"

          echo "===== Flet JSON version command ====="
          uv run flet --version --json > flet-output.txt 2> flet-error.txt || true

          echo "--- Standard output ---"
          cat flet-output.txt

          echo "--- Error output ---"
          cat flet-error.txt

          echo "===== Flet normal version command ====="
          uv run flet --version || true

      - name: Build unsigned iOS archive
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Show generated iOS build files
        run: |
          echo "Build output: ${{ steps.build.outputs.output-path }}"
          find "${{ steps.build.outputs.output-path }}" -maxdepth 6 -name "*.xcarchive" -print
          find "${{ steps.build.outputs.output-path }}" -maxdepth 6 -name "*.ipa" -print
          echo "The unsigned device build should produce an Xcode archive, not an installable IPA."

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v7
        with:
          name: BCT-iOS-Unsigned-Archive
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
