name: Build BCT Enrollment System - Unsigned iOS Archive

on:
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Build unsigned iOS archive
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Show generated iOS build files
        run: |
          echo "Build output: ${{ steps.build.outputs.output-path }}"
          find "${{ steps.build.outputs.output-path }}" -maxdepth 5 \\( -name "*.xcarchive" -o -name "*.ipa" \\) -print
          echo "The expected unsigned output is an .xcarchive, not an installable .ipa."

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v7
        with:
          name: BCT-iOS-Unsigned-Archive
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
